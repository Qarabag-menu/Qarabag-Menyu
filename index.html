<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qarabağ Çay Evi - Menyu</title>
    <style>
        :root {
            --bg: #fbfaf7;
            --card: #ffffff;
            --text: #2b2622;
            --muted: #8a8279;
            --line: #ece7df;
            --accent: #8c3b2a;      /* mürəbbə / çay rəngi */
            --accent-soft: #f3e6e1;
        }
 
        * { box-sizing: border-box; }
 
        body {
            margin: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-text-size-adjust: 100%;
        }
 
        header {
            text-align: center;
            padding: 36px 16px 20px;
        }
 
        h1 {
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin: 0 0 6px;
        }
 
        .subtitle {
            font-size: 0.85rem;
            letter-spacing: 4px;
            color: var(--muted);
            text-transform: uppercase;
        }
 
        /* Yapışan və yana sürüşən kateqoriya paneli */
        .tabs-wrap {
            position: sticky;
            top: 0;
            z-index: 10;
            background: var(--bg);
            border-bottom: 1px solid var(--line);
        }
 
        .tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 12px 16px;
            max-width: 760px;
            margin: 0 auto;
            scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar { display: none; }
 
        .tab-btn {
            flex: 0 0 auto;
            background: transparent;
            color: #5b534b;
            border: 1px solid var(--line);
            padding: 8px 16px;
            font-size: 0.9rem;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            transition: background .15s, color .15s, border-color .15s;
        }
        .tab-btn:hover { border-color: var(--accent); color: var(--accent); }
        .tab-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .tab-btn:focus-visible, .search input:focus-visible, .copy-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
 
        main {
            max-width: 760px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }
 
        .search { margin-bottom: 18px; }
        .search input {
            width: 100%;
            padding: 11px 14px;
            font-size: 0.95rem;
            font-family: inherit;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--card);
            color: var(--text);
        }
 
        .menu-container { display: none; }
        .menu-container.active { display: block; }
 
        .category-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin: 26px 0 4px;
            color: var(--text);
        }
        .category-title:first-child { margin-top: 4px; }
 
        .item-list { list-style: none; padding: 0; margin: 0; }
 
        .item-list li {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px solid var(--line);
        }
        .item-list li:last-child { border-bottom: none; }
 
        /* Şəkil ölçüsü: böyük olsun deyə 92px */
        .thumb {
            position: relative;
            flex: 0 0 92px;
            width: 92px;
            height: 92px;
            border-radius: 12px;
            background: var(--accent-soft);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
        }
        .thumb img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity .3s;
        }
 
        .item-name { flex: 1; font-size: 1rem; line-height: 1.3; }
 
        .item-side {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }
        .item-price { font-weight: 600; white-space: nowrap; }
 
        .badge-bitib {
            font-size: 0.72rem;
            letter-spacing: .5px;
            text-transform: uppercase;
            color: #fff;
            background: #9a928a;
            padding: 3px 8px;
            border-radius: 10px;
        }
 
        /* Bitmiş məhsul: solğun və ağ-qara şəkil */
        .item-list li.bitib .thumb img { filter: grayscale(.6); }
        .item-list li.bitib .thumb,
        .item-list li.bitib .item-name,
        .item-list li.bitib .item-price { opacity: .65; }
 
        .empty-message {
            text-align: center;
            color: var(--muted);
            margin-top: 40px;
            font-size: 0.95rem;
        }
 
        .wifi {
            max-width: 330px;
            margin: 10px auto 0;
            padding: 14px 18px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--card);
            text-align: center;
            font-size: 0.92rem;
            line-height: 1.8;
        }
        .wifi-title {
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 2px;
        }
        .copy-btn {
            margin-left: 6px;
            font-family: inherit;
            font-size: 0.78rem;
            padding: 3px 10px;
            border: 1px solid var(--line);
            background: var(--accent-soft);
            color: var(--accent);
            border-radius: 12px;
            cursor: pointer;
        }
 
        footer {
            text-align: center;
            color: var(--muted);
            font-size: 0.8rem;
            padding: 0 16px 40px;
        }
        footer .note { margin-top: 18px; }
 
        @media (max-width: 420px) {
            h1 { font-size: 1.6rem; letter-spacing: 4px; }
            .thumb { flex-basis: 84px; width: 84px; height: 84px; }
            .item-list li { gap: 12px; }
        }
    </style>
</head>

                    m("sq60", "WINSTON nano XS silver (qara)", "5.00", "🚬", ""),
                    m("sq61", "WINSTON kompakt XStyle aroma blend qara", "5.00", "🚬", ""),
                    m("sq62", "WINSTON nano caster aroma blend ballı", "5.00", "🚬", ""),
                    m("sq63", "WINSTON kompakt caster aroma blend ballı", "5.00", "🚬", ""),
                    m("sq64", "WINSTON kom XStyle dual mentol", "5.00", "🚬", ""),
                    m("sq65", "WINSTON kompakt XStyle göy", "5.00", "🚬", ""),
                    m("sq66", "WINSTON XStyle (boz)", "5.00", "🚬", "")
                ]}
            ]
        };
 
        const categories = [
            { id: 'murebbe',   ad: 'Mürəbbələr' },
            { id: 'isti',      ad: 'İsti İçkilər' },
            { id: 'soyuq',     ad: 'Soyuq İçkilər' },
            { id: 'sirniyyat', ad: 'Şirniyyat' },
            { id: 'cerez',     ad: 'Çərəzlər' },
            { id: 'qelyanalti',ad: 'Qəlyanaltılar' },
            { id: 'piva',      ad: 'Pivə Setləri' },
            { id: 'siqaret',   ad: 'Siqaretlər' }
        ];
 
        function esc(s) {
            return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }
 
        // Əvvəlcə emoji görünür, şəkil yüklənəndə üstünə yumşaq keçir
        function thumbHTML(item) {
            const emoji = item.emoji || '🍵';
            const src = item.sekil || (item.kod ? IMG_DIR + item.kod + IMG_EXT : '');
            if (!src) return `<div class="thumb" aria-hidden="true">${emoji}</div>`;
            return `<div class="thumb" aria-hidden="true">${emoji}<img src="${esc(src)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onload="this.style.opacity=1" onerror="this.remove()"></div>`;
        }
 
        function renderMenu() {
            const tabs = document.getElementById('tabs');
            const menus = document.getElementById('menus');
            let tabsHtml = '', menusHtml = '';
 
            categories.forEach((cat, i) => {
                tabsHtml += `<button class="tab-btn${i === 0 ? ' active' : ''}" data-tab="${cat.id}">${cat.ad}</button>`;
 
                const data = db[cat.id];
                let inner = '';
                if (data.length === 0) {
                    inner = `<div class="empty-message">Bu bölməyə tezliklə məhsullar əlavə olunacaq.</div>`;
                } else {
                    data.forEach(qrup => {
                        const items = qrup.mehsullar.map(item => {
                            const bitib = BITIB_AKTIV && BITIB.includes(item.kod);
                            return `
                            <li class="${bitib ? 'bitib' : ''}">
                                ${thumbHTML(item)}
                                <span class="item-name">${esc(item.ad)}</span>
                                <div class="item-side">
                                    <span class="item-price">${item.qiymet ? esc(item.qiymet) + ' ₼' : ''}</span>
                                    ${bitib ? '<span class="badge-bitib">Bitib</span>' : ''}
                                </div>
                            </li>`;
                        }).join('');
                        inner += `<h2 class="category-title">${esc(qrup.kateqoriya)}</h2>
                                  <ul class="item-list">${items}</ul>`;
                    });
                }
                menusHtml += `<div id="${cat.id}" class="menu-container${i === 0 ? ' active' : ''}">${inner}</div>`;
            });
 
            tabs.innerHTML = tabsHtml;
            menus.innerHTML = menusHtml;
 
            tabs.addEventListener('click', e => {
                const btn = e.target.closest('.tab-btn');
                if (btn) switchTab(btn);
            });
        }
 
        function switchTab(btn) {
            document.querySelectorAll('.menu-container').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(btn.dataset.tab).classList.add('active');
            btn.classList.add('active');
            btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            document.getElementById('search').value = '';
            filterItems('');
        }
 
        // Aktiv bölmədə axtarış
        function filterItems(q) {
            q = q.trim().toLocaleLowerCase('az');
            const active = document.querySelector('.menu-container.active');
            let shown = 0;
            active.querySelectorAll('.item-list li').forEach(li => {
                const name = li.querySelector('.item-name').textContent.toLocaleLowerCase('az');
                const match = !q || name.includes(q);
                li.style.display = match ? '' : 'none';
                if (match) shown++;
            });
            active.querySelectorAll('.item-list').forEach(ul => {
                const any = Array.from(ul.children).some(li => li.style.display !== 'none');
                ul.style.display = any ? '' : 'none';
                const h = ul.previousElementSibling;
                if (h) h.style.display = any ? '' : 'none';
            });
            const hasItems = active.querySelector('.item-list');
            document.getElementById('noResult').style.display = (hasItems && shown === 0) ? 'block' : 'none';
        }
 
        // Wi-Fi şifrəsini kopyala
        function setupCopy() {
            const btn = document.getElementById('copyBtn');
            const pass = document.getElementById('wifiPass');
            btn.addEventListener('click', async () => {
                try {
                    await navigator.clipboard.writeText(pass.textContent.trim());
                    btn.textContent = 'Kopyalandı ✓';
                } catch (err) {
                    const r = document.createRange();
                    r.selectNodeContents(pass);
                    const s = window.getSelection();
                    s.removeAllRanges();
                    s.addRange(r);
                    btn.textContent = 'Seçildi';
                }
                setTimeout(() => { btn.textContent = 'Kopyala'; }, 2000);
            });
        }
 
        document.addEventListener('DOMContentLoaded', () => {
            renderMenu();
            setupCopy();
            document.getElementById('search').addEventListener('input', e => filterItems(e.target.value));
        });
    </script>
</body>
</html>
