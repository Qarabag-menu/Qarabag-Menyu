<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#14171d">
    <title>Qarabağ Çay Evi - Menyu</title>
    <link rel="icon" href="sekiller/logo.jpg">
    <link rel="apple-touch-icon" href="sekiller/logo.jpg">
    <style>
        :root {
            --bg: #f8f4ec;
            --card: #ffffff;
            --text: #241f1a;
            --muted: #8a8072;
            --line: #ece4d6;
            --ink: #14171d;
            --gold: #b98a2e;
            --gold-2: #e3bf6a;
            --gold-soft: #f4e8cc;
            --wine: #7b1e2b;
            --accent-soft: #f3e6e1;
            --serif: Georgia, 'Times New Roman', serif;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-text-size-adjust: 100%;
            padding-bottom: calc(86px + env(safe-area-inset-bottom, 0px));
        }
        a { color: inherit; text-decoration: none; }
        button { font-family: inherit; }
        .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }

        /* ---------- Hero ---------- */
        .hero {
            position: relative;
            background: linear-gradient(180deg, rgba(14,16,21,.45) 0%, rgba(14,16,21,.93) 100%),
                        #14171d url('sekiller/qarabag.jpg') center 30% / cover no-repeat;
            color: #fff;
            text-align: center;
            padding: calc(22px + env(safe-area-inset-top, 0px)) 16px 56px;
        }
        .logo {
            width: 138px; height: 138px;
            border-radius: 50%;
            border: 2px solid var(--gold-2);
            box-shadow: 0 8px 30px rgba(0,0,0,.55), 0 0 0 6px rgba(227,191,106,.18);
            background: #14171d;
            display: block; margin: 0 auto;
        }
        .logo-text { display: none; font-family: var(--serif); font-size: 2rem; letter-spacing: 6px; color: var(--gold-2); }
        .logo-text small { display: block; font-size: .8rem; letter-spacing: 6px; color: #fff; margin-top: 4px; }
        .menu-label {
            margin-top: 18px;
            display: flex; align-items: center; justify-content: center; gap: 12px;
            font-size: .8rem; letter-spacing: 7px; color: var(--gold-2);
        }
        .menu-label span { width: 42px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-2)); }
        .menu-label span:last-child { transform: scaleX(-1); }

        /* ---------- Axtarış ---------- */
        .searchbox { margin: -28px auto 4px; position: relative; z-index: 2; }
        .searchbox input, .cat-search {
            width: 100%;
            font-family: inherit;
            font-size: 1rem;
            padding: 15px 16px 15px 46px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: #fff;
            color: var(--text);
            box-shadow: 0 8px 24px rgba(40,28,10,.14);
            outline: none;
        }
        .searchbox input:focus, .cat-search:focus { border-color: var(--gold); }
        .searchbox::before, .catbar-search::before {
            content: '🔍'; position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 1rem; opacity: .7; z-index: 1;
        }

        /* ---------- Bölmə başlıqları ---------- */
        .sec-title {
            font-family: var(--serif);
            font-size: 1.28rem;
            margin: 28px 0 12px;
            display: flex; align-items: center; gap: 10px;
        }
        .sec-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--gold-2), transparent); }
        .sec-sub { font-size: .82rem; color: var(--muted); margin: -6px 0 12px; }

        /* ---------- Endirimlər ---------- */
        .promo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .promo-card {
            position: relative;
            background: var(--card);
            border-radius: 18px;
            padding: 10px;
            box-shadow: 0 4px 16px rgba(60,40,10,.08);
            border: 1px solid var(--line);
        }
        .promo-card .thumb { width: 100%; height: auto; aspect-ratio: 1 / .86; flex: none; border-radius: 12px; font-size: 3rem; }
        .promo-name { font-size: .9rem; line-height: 1.25; margin: 8px 2px 4px; min-height: 2.5em; }
        .promo-prices { display: flex; align-items: baseline; gap: 8px; margin: 0 2px 2px; }
        .price-new { font-weight: 700; color: var(--wine); font-size: 1.05rem; }
        .price-old { color: var(--muted); text-decoration: line-through; font-size: .85rem; }
        .badge-off {
            position: absolute; top: 6px; left: 6px; z-index: 3;
            background: var(--wine); color: #fff; font-weight: 700; font-size: .78rem;
            padding: 4px 9px; border-radius: 10px;
            box-shadow: 0 2px 8px rgba(123,30,43,.4);
        }

        /* ---------- Setlər ---------- */
        .set-card {
            display: flex; align-items: center; gap: 14px;
            background: linear-gradient(135deg, #1c2028, #14171d);
            color: #fff;
            border-radius: 18px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: 0 6px 20px rgba(20,23,29,.25);
            border: 1px solid rgba(227,191,106,.35);
        }
        .set-pics { position: relative; flex: 0 0 auto; display: flex; padding-left: 12px; }
        .mini {
            width: 52px; height: 52px; margin-left: -12px;
            border-radius: 50%; border: 2px solid var(--gold-2);
            background: var(--gold-soft); color: #000;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem; overflow: hidden; position: relative;
        }
        .mini img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(1.2); }
        .set-body { flex: 1; min-width: 0; }
        .set-title { font-family: var(--serif); font-size: 1.08rem; color: var(--gold-2); }
        .set-items { font-size: .8rem; color: #d9d2c4; margin-top: 3px; line-height: 1.35; }
        .set-price { text-align: right; white-space: nowrap; }
        .set-price b { font-size: 1.2rem; color: #fff; display: block; }
        .set-price s { font-size: .8rem; color: #a99f8e; }
        .set-tag { font-size: .65rem; letter-spacing: 1.5px; color: var(--gold-2); text-transform: uppercase; }

        /* ---------- Kateqoriya kartları ---------- */
        .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .tile {
            display: flex; flex-direction: column;
            background: var(--card);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--line);
            box-shadow: 0 4px 16px rgba(60,40,10,.08);
            transition: transform .15s;
        }
        .tile:active { transform: scale(.97); }
        .tile-pics { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; height: 104px; background: var(--tint, var(--gold-soft)); }
        .tile-pics span { position: relative; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; overflow: hidden; background: var(--tint, var(--gold-soft)); }
        .tile-pics img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(1.25); background: #fff; }
        .tile-txt { padding: 10px 12px 12px; display: flex; align-items: center; gap: 8px; }
        .tile-ico { font-size: 1.3rem; }
        .tile-name { font-weight: 700; font-size: .95rem; line-height: 1.2; }
        .tile-count { font-size: .75rem; color: var(--muted); margin-top: 2px; }

        /* ---------- Kateqoriya səhifəsi ---------- */
        .catbar {
            position: sticky; top: 0; z-index: 20;
            background: rgba(248,244,236,.96);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--line);
            padding: calc(10px + env(safe-area-inset-top, 0px)) 0 10px;
        }
        .catbar-row { display: flex; align-items: center; gap: 10px; }
        .back {
            width: 42px; height: 42px; flex: 0 0 auto;
            border-radius: 14px; background: var(--ink); color: var(--gold-2);
            display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
        }
        .cat-title-main { font-family: var(--serif); font-size: 1.25rem; line-height: 1.1; }
        .cat-count { font-size: .75rem; color: var(--muted); }
        .catbar-search { position: relative; margin-top: 10px; }
        .cat-search { box-shadow: none; padding: 11px 14px 11px 42px; font-size: .95rem; border-radius: 12px; }

        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; }
        .chip {
            border: 1px solid var(--gold); background: transparent; color: var(--wine);
            padding: 5px 11px; border-radius: 16px; font-size: .76rem; cursor: pointer;
        }
        .chip:active { background: var(--gold-soft); }

        .category-title {
            font-family: var(--serif);
            font-size: 1.12rem;
            margin: 26px 0 10px;
            scroll-margin-top: 150px;
            display: flex; align-items: center; gap: 8px;
        }
        .category-title::before { content: '◆'; color: var(--gold); font-size: .7rem; }

        .item-list {
            list-style: none; margin: 0; padding: 2px 14px;
            background: var(--card);
            border-radius: 18px;
            border: 1px solid var(--line);
            box-shadow: 0 4px 16px rgba(60,40,10,.06);
        }
        .item-list li { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
        .item-list li:last-child { border-bottom: none; }

        .thumb {
            position: relative;
            flex: 0 0 92px; width: 92px; height: 92px;
            border-radius: 14px;
            background: var(--accent-soft);
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.2rem;
            border: 0; padding: 0; margin: 0; font-family: inherit; color: inherit;
        }
        .thumb img {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; opacity: 0; transition: opacity .3s;
            transform: scale(1.22);
            background: #fff;
        }
        .thumb.has-img { cursor: zoom-in; }
        .thumb.has-img::after {
            content: "+"; position: absolute; right: 5px; bottom: 5px;
            width: 22px; height: 22px; border-radius: 50%;
            background: rgba(0,0,0,.55); color: #fff;
            font-size: 16px; line-height: 22px; text-align: center; z-index: 2;
        }
        .item-name { flex: 1; font-size: 1rem; line-height: 1.3; }
        .item-side { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
        .item-price { font-weight: 700; white-space: nowrap; color: var(--wine); }
        .item-price small { font-weight: 400; color: var(--muted); font-size: .78rem; }
        .badge-bitib { font-size: .72rem; letter-spacing: .5px; text-transform: uppercase; color: #fff; background: #9a928a; padding: 3px 8px; border-radius: 10px; margin-top: 4px; }
        .item-list li.bitib .thumb img { filter: grayscale(.6); }
        .item-list li.bitib .thumb, .item-list li.bitib .item-name, .item-list li.bitib .item-price { opacity: .65; }

        .res-cat { font-size: .85rem; color: var(--muted); margin: 22px 0 8px; letter-spacing: 1px; text-transform: uppercase; }
        .empty-message { text-align: center; color: var(--muted); margin: 40px 0; font-size: .95rem; }

        /* ---------- Wi-Fi ---------- */
        .wifi {
            max-width: 360px; margin: 30px auto 0; padding: 16px 18px;
            border: 1px solid var(--line); border-radius: 18px; background: var(--card);
            text-align: center; font-size: .95rem; line-height: 1.9;
            box-shadow: 0 4px 16px rgba(60,40,10,.06);
        }
        .wifi-title { font-size: .75rem; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }
        .copy-btn {
            margin-left: 8px; font-size: .78rem; padding: 4px 12px;
            border: 1px solid var(--gold); background: var(--gold-soft); color: var(--wine);
            border-radius: 14px; cursor: pointer;
        }
        .foot-note { text-align: center; color: var(--muted); font-size: .8rem; margin: 18px 0 6px; }

        /* ---------- Aşağı naviqasiya ---------- */
        .nav {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
            background: rgba(20,23,29,.97);
            border-top: 1px solid rgba(227,191,106,.35);
            padding: 6px 10px calc(6px + env(safe-area-inset-bottom, 0px));
            display: flex; justify-content: space-around;
        }
        .nav-btn {
            flex: 1; max-width: 120px; background: none; border: 0; color: #b9b2a4;
            display: flex; flex-direction: column; align-items: center; gap: 2px;
            padding: 6px 0; font-size: .68rem; letter-spacing: .3px; cursor: pointer;
        }
        .nav-btn i { font-style: normal; font-size: 1.25rem; }
        .nav-btn.on { color: var(--gold-2); }

        /* ---------- Menyu pəncərəsi (aşağıdan açılır) ---------- */
        .sheet { position: fixed; inset: 0; z-index: 90; background: rgba(10,10,12,.6); display: none; align-items: flex-end; }
        .sheet.open { display: flex; }
        .sheet-panel {
            width: 100%; max-height: 82vh; overflow-y: auto;
            background: var(--bg); border-radius: 24px 24px 0 0;
            padding: 16px 16px calc(24px + env(safe-area-inset-bottom, 0px));
        }
        .sheet-grip { width: 44px; height: 5px; border-radius: 3px; background: #cfc6b4; margin: 0 auto 12px; }
        .sheet-title { font-family: var(--serif); font-size: 1.2rem; margin: 0 0 10px; text-align: center; }
        .sheet-link {
            display: flex; align-items: center; gap: 14px;
            padding: 13px 12px; border-radius: 14px; background: var(--card);
            border: 1px solid var(--line); margin-bottom: 8px; font-weight: 600;
        }
        .sheet-link i { font-style: normal; font-size: 1.4rem; width: 32px; text-align: center; }
        .sheet-link small { margin-left: auto; color: var(--muted); font-weight: 400; }

        /* ---------- Şəkil böyütmə ---------- */
        .lightbox { position: fixed; inset: 0; z-index: 100; background: rgba(20,16,14,.92); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; }
        .lightbox.open { display: flex; }
        .lightbox img { max-width: 94vw; max-height: 78vh; object-fit: contain; border-radius: 12px; background: #fff; }
        .lb-cap { color: #fff; font-size: .95rem; text-align: center; }
        .lb-close { position: absolute; top: 14px; right: 14px; width: 44px; height: 44px; border: 0; border-radius: 50%; background: rgba(255,255,255,.2); color: #fff; font-size: 20px; cursor: pointer; }

        /* ---------- Görünüşlər ---------- */
        body.v-home #catView { display: none; }
        body.v-cat #homeView, body.v-cat .hero { display: none; }

        @media (min-width: 560px) {
            .promo-grid, .tiles { grid-template-columns: 1fr 1fr 1fr; }
            .tile-pics { height: 120px; }
        }
        @media (max-width: 380px) {
            .thumb { flex-basis: 80px; width: 80px; height: 80px; }
            .logo { width: 120px; height: 120px; }
        }
    </style>
</head>
<body class="v-home">

    <header class="hero" id="hero">
        <img class="logo" src="sekiller/logo.jpg" alt="Qarabağ Çay Evi" onerror="this.style.display='none';document.getElementById('logoText').style.display='block'">
        <div class="logo-text" id="logoText">QARABAĞ<small>ÇAY EVİ</small></div>
        <div class="menu-label"><span></span>MENYU<span></span></div>
    </header>

    <!-- ANA SƏHİFƏ -->
    <main id="homeView">
        <div class="wrap">
            <div class="searchbox"><input type="search" id="gsearch" placeholder="Axtar... (məs. s, sob, cola)" autocomplete="off" aria-label="Axtar"></div>

            <div id="searchResults" style="display:none;"></div>

            <div id="homeSections">
                <div id="promoSec"></div>
                <div id="setSec"></div>
                <h2 class="sec-title" id="menuAnchor">Menyu</h2>
                <div class="tiles" id="tiles"></div>

                <div class="wifi" id="wifi">
                    <div class="wifi-title">Wi-Fi</div>
                    <div>Şəbəkə: <b>Qarabağ</b></div>
                    <div>Şifrə: <b id="wifiPass">30303030</b><button class="copy-btn" id="copyBtn" type="button">Kopyala</button></div>
                </div>
                <div class="foot-note">Qiymətlər AZN ilə göstərilib · Xoş gəlmisiniz!</div>
            </div>
        </div>
    </main>

    <!-- KATEQORİYA SƏHİFƏSİ -->
    <section id="catView">
        <div class="catbar">
            <div class="wrap">
                <div class="catbar-row">
                    <a class="back" href="#/" aria-label="Geri">←</a>
                    <div><div class="cat-title-main" id="catName"></div><div class="cat-count" id="catCount"></div></div>
                </div>
                <div class="catbar-search"><input type="search" class="cat-search" id="csearch" placeholder="Bu bölmədə axtar..." autocomplete="off" aria-label="Bölmədə axtar"></div>
            </div>
        </div>
        <div class="wrap">
            <div class="chips" id="chips"></div>
            <div id="catList"></div>
            <div class="empty-message" id="noResult" style="display:none;">Heç nə tapılmadı.</div>
        </div>
    </section>

    <!-- AŞAĞI NAVİQASİYA -->
    <nav class="nav" aria-label="Naviqasiya">
        <button class="nav-btn on" id="navHome" type="button"><i>🏠</i>Ana səhifə</button>
        <button class="nav-btn" id="navMenu" type="button"><i>☰</i>Menyu</button>
        <button class="nav-btn" id="navSearch" type="button"><i>🔍</i>Axtar</button>
        <button class="nav-btn" id="navWifi" type="button"><i>📶</i>Wi-Fi</button>
    </nav>

    <!-- MENYU PƏNCƏRƏSİ -->
    <div class="sheet" id="sheet" aria-hidden="true">
        <div class="sheet-panel">
            <div class="sheet-grip"></div>
            <h2 class="sheet-title">Bölmələr</h2>
            <div id="sheetList"></div>
        </div>
    </div>

    <!-- ŞƏKİL BÖYÜTMƏ -->
    <div class="lightbox" id="lightbox" aria-hidden="true">
        <button class="lb-close" type="button" aria-label="Bağla">✕</button>
        <img alt="" referrerpolicy="no-referrer">
        <div class="lb-cap"></div>
    </div>

    <script>
        /* ------------------------------------------------------------------
           ŞƏKİLLƏR HAQQINDA:
           Hər məhsulun sonuna şəkil linki yazılır: m("kod", "ad", "qiymət", "emoji", "LİNK")
           Link boşdursa sayt "sekiller/kod.jpg" faylını axtarır, o da yoxdursa emoji görünür.
        ------------------------------------------------------------------ */
        const IMG_DIR = 'sekiller/';
        const IMG_EXT = '.jpg';

        /* ------------------------------------------------------------------
           BİTİB SİYAHISI:
           Aşağıdakı kodlar "Bitib" kimi göstərilir.
           Mürəbbə gələndə həmin sətri SİL (və ya qarşısına // yaz).
           Mürəbbə bitəndə kodunu yenidən bura əlavə et.
           Yadda saxla: hər sətir dırnaqda olmalı və sonunda vergül qalmalıdır.
        ------------------------------------------------------------------ */
        // Bitib sistemini yandırıb-söndürmək: false = söndürülüb, true = yandırılıb
        const BITIB_AKTIV = false;

        const BITIB = [
            "heyva",
            "encir",
            "boyurtken",
            "ciyelek",
            "armud",
            "nar",
            "kivi",
            "cir-visne",
            "ag-erik",
            "ag-gilas",
            "zogal",
            "qizilgul",
            "qarpiz",
            "sponka-visne",
            "yasil-badam",
            "qirmizi-badam",
            "sari-badam",
            "snikers",
            "baunty",
            "ananas",
            "qirmizi-gilas",
            "malina",
            "zeytun",
            "dondurma",
            "bananli-plombir",
            "qoz"
            "AĞ GİLAS QOZLU"
        ];

        // m(kod, ad, qiymət, emoji, ŞƏKİL LİNKİ)
        const m = (kod, ad, qiymet, emoji, sekil) => ({ kod, ad, qiymet, emoji, sekil });
        // İki qiymətli məhsul (fincan / çaynik): fc("1.00", "4.00")
        const fc = (a, b) => [["fincan", a], ["çaynik", b]];

        const db = {
            murebbe: [
                { kateqoriya: "Mürəbbələr", mehsullar: [
                    m("heyva", "HEYVA mürəbbəsi", "4.00", "🍐", "https://www.azcookbook.com/wp-content/uploads/2010/11/quince-preserve2.jpg"),
                    m("encir", "Əncir mürəbbəsi", "5.00", "🍯", "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSC20Yj2bV4zakWyttxsvGERGYn9T6RUW3yzplvx4DCUksuEDY9zRC1p5g8&s=10"),
                    m("boyurtken", "BÖYÜRTKƏN mürəbbəsi", "5.00", "🫐", "https://i.ytimg.com/vi/_MrLzEvGecs/hqdefault.jpg"),
                    m("ciyelek", "ÇİYƏLƏK mürəbbəsi", "5.00", "🍓", "https://upload.wikimedia.org/wikipedia/commons/8/88/Az-Strawberry_jam%2C_making_by_e-citizen_%28moonsun1981%29.JPG?utm_source=az.wikibooks.org&utm_campaign=index&utm_content=original"),
                    m("armud", "ARMUD mürəbbəsi", "5.00", "🍐", "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ90asO9G75jKG5Tl1nayIpbu2h_7-0VbtER7sIxLPPEE11sBFcrCfievM&s=10"),
                    m("nar", "NAR mürəbbəsi", "5.00", "🍎", "https://i.ytimg.com/vi/FLznDXp1M1E/sddefault.jpg"),

        function norm(str) {
            return String(str).toLowerCase().normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/ə/g, 'e').replace(/ı/g, 'i');
        }
        function priceText(q) {
            if (!q) return '';
            if (Array.isArray(q)) return q.map(([l, p]) => l + ' ' + p + ' ₼').join(' · ');
            return q + ' ₼';
        }
        function priceHTML(q) {
            if (!q) return '<span class="item-price"></span>';
            if (Array.isArray(q)) return q.map(([l, p]) => `<span class="item-price"><small>${esc(l)}</small> ${esc(p)} ₼</span>`).join('');
            return `<span class="item-price">${esc(q)} ₼</span>`;
        }
        function priceNum(q) {
            const v = Array.isArray(q) ? q[0][1] : q;
            const n = parseFloat(String(v || '').replace(',', '.'));
            return isNaN(n) ? 0 : n;
        }
        function srcOf(item) { return item.sekil || (item.kod ? IMG_DIR + item.kod + IMG_EXT : ''); }

        // Əvvəlcə emoji görünür, şəkil yüklənəndə üstünə keçir və şəkil böyüdülə bilər
        function thumbHTML(item) {
            const emoji = item.emoji || '🍵';
            const src = srcOf(item);
            if (!src) return `<div class="thumb">${emoji}</div>`;
            return `<button type="button" class="thumb" aria-label="Şəkli böyüt">${emoji}<img src="${esc(src)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onload="this.style.opacity=1;this.parentNode.classList.add('has-img')" onerror="this.remove()"></button>`;
        }
        function itemHTML(item, idx) {
            const bitib = BITIB_AKTIV && BITIB.includes(item.kod);
            const cap = item.ad + (priceText(item.qiymet) ? ' — ' + priceText(item.qiymet) : '');
            return `<li class="${bitib ? 'bitib' : ''}" data-n="${esc(norm(item.ad))}" data-i="${idx}" data-cap="${esc(cap)}">
                ${thumbHTML(item)}
                <span class="item-name">${esc(item.ad)}</span>
                <div class="item-side">${priceHTML(item.qiymet)}${bitib ? '<span class="badge-bitib">Bitib</span>' : ''}</div>
            </li>`;
        }

        // ---------- Ana səhifə ----------
        function renderPromo() {
            const cards = ENDIRIM.map(([kod, yeni]) => {
                const it = byCode[kod];
                if (!it) return '';
                const old = priceNum(it.qiymet);
                const pct = old > 0 ? Math.round((old - parseFloat(yeni)) / old * 100) : 0;
                const cap = `${it.ad} — ${yeni} ₼ (əvvəl ${old.toFixed(2)} ₼)`;
                return `<div class="promo-card" data-cap="${esc(cap)}">
                    ${pct > 0 ? `<div class="badge-off">-${pct}%</div>` : ''}
                    ${thumbHTML(it)}
                    <div class="promo-name">${esc(it.ad)}</div>
                    <div class="promo-prices"><span class="price-new">${esc(yeni)} ₼</span><span class="price-old">${old.toFixed(2)} ₼</span></div>
                </div>`;
            }).join('');
            $('promoSec').innerHTML = cards ? `<h2 class="sec-title">🔥 Endirimli məhsullar</h2><div class="promo-grid">${cards}</div>` : '';
        }

        function renderSets() {
            const cards = SETLER.map(s => {
                const rows = s.items.map(([kod, say]) => ({ it: byCode[kod], say })).filter(r => r.it);
                if (!rows.length) return '';
                const sum = rows.reduce((t, r) => t + priceNum(r.it.qiymet) * r.say, 0);
                const price = s.qiymet ? parseFloat(s.qiymet) : sum;
                const pics = rows.slice(0, 3).map(r => {
                    const src = srcOf(r.it);
                    return `<span class="mini">${r.it.emoji || s.emoji}${src ? `<img src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer" onload="this.style.opacity=1" onerror="this.remove()">` : ''}</span>`;
                }).join('');
                const names = rows.map(r => (r.say > 1 ? r.say + ' × ' : '') + r.it.ad).join(' + ');
                return `<div class="set-card">
                    <div class="set-pics">${pics}</div>
                    <div class="set-body"><div class="set-tag">Set</div><div class="set-title">${esc(s.emoji + ' ' + s.ad)}</div><div class="set-items">${esc(names)}</div></div>
                    <div class="set-price"><b>${price.toFixed(2)} ₼</b>${price < sum - 0.001 ? `<s>${sum.toFixed(2)} ₼</s>` : ''}</div>
                </div>`;
            }).join('');
            $('setSec').innerHTML = cards ? `<h2 class="sec-title">🎁 Setlər</h2>${cards}` : '';
        }

        function renderTiles() {
            $('tiles').innerHTML = categories.map(c => {
                const groups = db[c.id] || [];
                const all = groups.flatMap(g => g.mehsullar);
                const withImg = all.filter(i => i.sekil).slice(0, 4);
                const cells = [];
                for (let k = 0; k < 4; k++) {
                    const it = withImg[k];
                    cells.push(it
                        ? `<span>${esc(it.emoji || c.emoji)}<img src="${esc(it.sekil)}" alt="" loading="lazy" referrerpolicy="no-referrer" onload="this.style.opacity=1" onerror="this.remove()" style="opacity:0;transition:opacity .3s"></span>`
                        : `<span>${k === 0 ? c.emoji : ''}</span>`);
                }
                return `<a class="tile" href="#/k/${c.id}" style="--tint:${c.tint}">
                    <div class="tile-pics">${cells.join('')}</div>
                    <div class="tile-txt"><div><div class="tile-name">${esc(c.ad)}</div><div class="tile-count">${all.length} məhsul</div></div></div>
                </a>`;
            }).join('');
            $('sheetList').innerHTML = categories.map(c => {
                const n = (db[c.id] || []).reduce((t, g) => t + g.mehsullar.length, 0);
                return `<a class="sheet-link" href="#/k/${c.id}"><i>${c.emoji}</i>${esc(c.ad)}<small>${n}</small></a>`;
            }).join('');
        }

        // ---------- Axtarış ----------
        function tokensOf(q) { return norm(q).trim().split(/\s+/).filter(Boolean); }
        function matchName(n, tokens) {
            const words = n.split(/[^a-z0-9]+/).filter(Boolean);
            return tokens.every(t => words.some(w => w.startsWith(t)));
        }

        function globalSearch(q) {
            const tokens = tokensOf(q);
            const box = $('searchResults'), home = $('homeSections');
            if (!tokens.length) { box.style.display = 'none'; home.style.display = ''; return; }
            const full = tokens.join(' ');
            let html = '', total = 0;
            categories.forEach(c => {
                const rows = [];
                (db[c.id] || []).forEach(g => g.mehsullar.forEach((it, i) => {
                    const n = norm(it.ad);
                    if (matchName(n, tokens)) rows.push({ it, r: n.startsWith(full) ? 0 : 1, i: rows.length });
                }));
                if (!rows.length) return;
                rows.sort((a, b) => (a.r - b.r) || (a.i - b.i));
                total += rows.length;
                html += `<div class="res-cat">${c.emoji} ${esc(c.ad)}</div><ul class="item-list">${rows.map((r, k) => itemHTML(r.it, k)).join('')}</ul>`;
            });
            box.innerHTML = total ? html : '<div class="empty-message">Heç nə tapılmadı.</div>';
            box.style.display = '';
            home.style.display = 'none';
        }

        function filterCat(q) {
            const tokens = tokensOf(q);
            const full = tokens.join(' ');
            let shown = 0;
            document.querySelectorAll('#catList .item-list').forEach(ul => {
                const lis = Array.from(ul.children);
                const rank = new Map();
                lis.forEach(li => {
                    const n = li.dataset.n || '';
                    const ok = matchName(n, tokens);
                    li.style.display = ok ? '' : 'none';
                    rank.set(li, tokens.length && n.startsWith(full) ? 0 : 1);
                    if (ok) shown++;
                });
                lis.sort((x, y) => (rank.get(x) - rank.get(y)) || (Number(x.dataset.i) - Number(y.dataset.i))).forEach(li => ul.appendChild(li));
                const any = lis.some(li => li.style.display !== 'none');
                ul.style.display = any ? '' : 'none';
                const h = ul.previousElementSibling;
                if (h && h.classList.contains('category-title')) h.style.display = any ? '' : 'none';
            });
            $('noResult').style.display = shown === 0 ? 'block' : 'none';
        }

        // ---------- Kateqoriya səhifəsi ----------
        function renderCat(id) {
            const c = categories.find(x => x.id === id);
            const groups = db[id] || [];
            const total = groups.reduce((t, g) => t + g.mehsullar.length, 0);
            $('catName').textContent = c.emoji + ' ' + c.ad;
            $('catCount').textContent = total + ' məhsul';
            $('chips').innerHTML = groups.length > 1
                ? groups.map((g, gi) => `<button class="chip" type="button" data-g="${gi}">${esc(g.kateqoriya)}</button>`).join('')
                : '';
            $('catList').innerHTML = groups.length
                ? groups.map((g, gi) => `<h2 class="category-title" id="g${gi}">${esc(g.kateqoriya)}</h2><ul class="item-list">${g.mehsullar.map((it, i) => itemHTML(it, i)).join('')}</ul>`).join('')
                : '<div class="empty-message">Bu bölməyə tezliklə məhsullar əlavə olunacaq.</div>';
            $('csearch').value = '';
            $('noResult').style.display = 'none';
        }

        // ---------- Marşrut (geri düyməsi də işləyir) ----------
        let pendingScroll = null;
        function route() {
            const m = (location.hash || '#/').match(/^#\/k\/([a-z]+)/);
            const cat = m && categories.some(c => c.id === m[1]) ? m[1] : null;
            closeSheet();
            if (cat) {
                document.body.className = 'v-cat';
                renderCat(cat);
                window.scrollTo(0, 0);
            } else {
                document.body.className = 'v-home';
                if (pendingScroll) {
                    const el = $(pendingScroll); pendingScroll = null;
                    if (el) setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'center' }), 60);
                } else {
                    window.scrollTo(0, 0);
                }
            }
            $('navHome').classList.toggle('on', !cat);
            $('navMenu').classList.toggle('on', !!cat);
        }

        function openSheet() { $('sheet').classList.add('open'); $('sheet').setAttribute('aria-hidden', 'false'); document.body.style.overflow = 'hidden'; }
        function closeSheet() { $('sheet').classList.remove('open'); $('sheet').setAttribute('aria-hidden', 'true'); document.body.style.overflow = ''; }

        // ---------- Şəkli böyüt ----------
        function setupLightbox() {
            const box = $('lightbox');
            const img = box.querySelector('img');
            const cap = box.querySelector('.lb-cap');
            function close() {
                box.classList.remove('open');
                box.setAttribute('aria-hidden', 'true');
                document.body.style.overflow = '';
                img.removeAttribute('src');
            }
            document.addEventListener('click', e => {
                if (box.classList.contains('open')) { close(); return; }
                const t = e.target.closest('.thumb.has-img');
                if (!t) return;
                const small = t.querySelector('img');
                const holder = t.closest('[data-cap]');
                img.src = small.currentSrc || small.src;
                cap.textContent = holder ? holder.dataset.cap : '';
                box.classList.add('open');
                box.setAttribute('aria-hidden', 'false');
                document.body.style.overflow = 'hidden';
            });
            document.addEventListener('keydown', e => { if (e.key === 'Escape') { close(); closeSheet(); } });
        }

        // ---------- Wi-Fi şifrəsini kopyala ----------
        function setupCopy() {
            const btn = $('copyBtn'), pass = $('wifiPass');
            btn.addEventListener('click', async () => {
                try {
                    await navigator.clipboard.writeText(pass.textContent.trim());
                    btn.textContent = 'Kopyalandı ✓';
                } catch (err) {
                    const r = document.createRange(); r.selectNodeContents(pass);
                    const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
                    btn.textContent = 'Seçildi';
                }
                setTimeout(() => { btn.textContent = 'Kopyala'; }, 2000);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderPromo();
            renderSets();
            renderTiles();
            setupCopy();
            setupLightbox();

            $('gsearch').addEventListener('input', e => globalSearch(e.target.value));
            $('csearch').addEventListener('input', e => filterCat(e.target.value));

            $('chips').addEventListener('click', e => {
                const b = e.target.closest('.chip');
                if (!b) return;
                const h = $('g' + b.dataset.g);
                if (h) h.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });

            $('navHome').addEventListener('click', () => {
                $('gsearch').value = ''; globalSearch('');
                if (location.hash && location.hash !== '#/') location.hash = '#/'; else window.scrollTo({ top: 0, behavior: 'smooth' });
            });
            $('navMenu').addEventListener('click', openSheet);
            $('sheet').addEventListener('click', e => { if (e.target === $('sheet') || e.target.closest('.sheet-link')) closeSheet(); });
            $('navSearch').addEventListener('click', () => {
                if (location.hash && location.hash !== '#/') { location.hash = '#/'; }
                setTimeout(() => { window.scrollTo({ top: 0, behavior: 'smooth' }); $('gsearch').focus(); }, 80);
            });
            $('navWifi').addEventListener('click', () => {
                $('gsearch').value = ''; globalSearch('');
                if (location.hash && location.hash !== '#/') { pendingScroll = 'wifi'; location.hash = '#/'; }
                else $('wifi').scrollIntoView({ behavior: 'smooth', block: 'center' });
            });

            window.addEventListener('hashchange', route);
            route();
        });
    </script>
</body>
</html>
