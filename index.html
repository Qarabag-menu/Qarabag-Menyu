<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qarabağ Kafe - Çay Evi</title>
    <style>
        /* Minimalist, təmiz və sadə dizayn */
        body {
            margin: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #ffffff; /* Təmiz ağ fon */
            color: #333333; /* Tünd boz/qara mətn */
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px 50px 10px;
        }

        header {
            text-align: center;
            margin: 30px 0 40px 0;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 300;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin: 0 0 5px 0;
            color: #111;
        }

        .subtitle {
            font-size: 0.9rem;
            letter-spacing: 3px;
            color: #777;
            text-transform: uppercase;
        }

        .tabs {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
            max-width: 800px;
        }

        .tab-btn {
            background-color: transparent;
            color: #555;
            border: 1px solid #ddd;
            padding: 8px 18px;
            font-size: 0.9rem;
            border-radius: 4px; /* Sadə dördbucaq kənarlar */
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            background-color: #222;
            color: #fff;
            border-color: #222;
        }

        .menu-container {
            width: 100%;
            max-width: 700px;
            display: none;
        }

        .menu-container.active {
            display: block;
        }

        .category-title {
            font-size: 1.2rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin: 0 0 15px 0;
            color: #222;
            text-align: center;
        }

        .item-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .item-list li {
            display: flex;
            justify-content: space-between;
            padding: 12px 5px;
            border-bottom: 1px dashed #e0e0e0;
            font-size: 0.95rem;
        }

        .item-list li:last-child {
            border-bottom: none;
        }

        .item-name {
            color: #333;
        }

        .item-price {
            font-weight: 600;
            color: #111;
        }

        .empty-message {
            text-align: center;
            color: #999;
            font-style: italic;
            margin-top: 30px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Qarabağ</h1>
        <div class="subtitle">Çay Evi</div>
    </header>

    <!-- Kateqoriya Düymələri -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('murebbe')">Mürəbbələr</button>
        <button class="tab-btn" onclick="switchTab('isti')">İsti İçkilər</button>
        <button class="tab-btn" onclick="switchTab('soyuq')">Soyuq İçkilər</button>
        <button class="tab-btn" onclick="switchTab('sirniyyat')">Şirniyyat</button>
        <button class="tab-btn" onclick="switchTab('cerez')">Çərəzlər</button>
        <button class="tab-btn" onclick="switchTab('qelyanalti')">Qəlyanaltılar</button>
        <button class="tab-btn" onclick="switchTab('piva')">Pivə Setləri</button>
        <button class="tab-btn" onclick="switchTab('siqaret')">Siqaretlər</button>
    </div>

    <!-- Məhsul Konteynerləri -->
    <div id="murebbe" class="menu-container active"></div>
    <div id="isti" class="menu-container"></div>
    <div id="soyuq" class="menu-container"></div>
    <div id="sirniyyat" class="menu-container"></div>
    <div id="cerez" class="menu-container"></div>
    <div id="qelyanalti" class="menu-container"></div>
    <div id="piva" class="menu-container"></div>
    <div id="siqaret" class="menu-container"></div>

    <script>
        // BAZA: Yalnız Mürəbbələr doludur, qalanları boş saxlanılıb
        const db = {
            murebbe: [
                { kateqoriya: "Mürəbbələr", mehsullar: [
                    { ad: "HEYVA mürəbbəsi", qiymet: "5.00" },
                    { ad: "Əncir mürəbbəsi", qiymet: "5.00" },
                    { ad: "BÖYÜRTKƏN mürəbbəsi", qiymet: "5.00" },
                    { ad: "ÇİYƏLƏK mürəbbəsi", qiymet: "5.00" },
                    { ad: "ARMUD mürəbbəsi", qiymet: "5.00" },
                    { ad: "NAR mürəbbəsi", qiymet: "5.00" },
                    { ad: "KİVİ mürəbbəsi", qiymet: "5.00" },
                    { ad: "Cır VİŞNƏ mürəbbəsi", qiymet: "5.00" },
                    { ad: "Ağ ƏRİK mürəbbəsi", qiymet: "6.00" },
                    { ad: "Ağ GİLAS mürəbbəsi", qiymet: "6.00" },
                    { ad: "ZOĞAL mürəbbəsi", qiymet: "6.00" },
                    { ad: "QIZILGÜL mürəbbəsi", qiymet: "6.00" },
                    { ad: "Qarpız mürəbbəsi", qiymet: "6.00" },
                    { ad: "ŞPONKA VİŞNƏ mürəbbəsi", qiymet: "6.50" },
                    { ad: "Yaşıl BADAM mürəbbəsi", qiymet: "6.50" },
                    { ad: "Qırmızı BADAM mürəbbəsi", qiymet: "6.50" },
                    { ad: "Sarı BADAM mürəbbəsi", qiymet: "6.50" },
                    { ad: "Snikers mürəbbəsi", qiymet: "6.50" },
                    { ad: "Baunty mürəbbəsi", qiymet: "6.50" },
                    { ad: "Ananas mürəbbəsi", qiymet: "6.50" },
                    { ad: "Qırmızı GİLAS mürəbbəsi", qiymet: "7.00" },
                    { ad: "MALİNA mürəbbəsi", qiymet: "7.00" },
                    { ad: "ZEYTUN mürəbbəsi", qiymet: "7.00" },
                    { ad: "DONDURMA mürəbbəsi", qiymet: "7.00" },
                    { ad: "BANANLI PLOMBİR mürəbbəsi", qiymet: "8.00" },
                    { ad: "QOZ mürəbbəsi", qiymet: "8.00" }
                ]}
            ],
            isti: [],
            soyuq: [],
            sirniyyat: [],
            cerez: [],
            qelyanalti: [],
            piva: [],
            siqaret: []
        };

        function renderMenu() {
            const categories = ['murebbe', 'isti', 'soyuq', 'sirniyyat', 'cerez', 'qelyanalti', 'piva', 'siqaret'];

            categories.forEach(catId => {
                const container = document.getElementById(catId);
                const data = db[catId];
                
                // Əgər kateqoriya boşdursa mesaj göstər
                if (data.length === 0) {
                    container.innerHTML = `<div class="empty-message">Bu bölməyə tezliklə məhsullar əlavə olunacaq.</div>`;
                    return;
                }

                // Əgər kateqoriya doludursa siyahını yarat
                let html = '';
                data.forEach(qrup => {
                    let listItems = '';
                    qrup.mehsullar.forEach(item => {
                        let qiymetStr = item.qiymet ? `${item.qiymet} ₼` : '';
                        listItems += `
                            <li>
                                <span class="item-name">${item.ad}</span>
                                <span class="item-price">${qiymetStr}</span>
                            </li>
                        `;
                    });

                    html += `
                        <h2 class="category-title">${qrup.kateqoriya}</h2>
                        <ul class="item-list">
                            ${listItems}
                        </ul>
                    `;
                });

                container.innerHTML = html;
            });
        }

        // Tabların dəyişməsi üçün funksiya
        function switchTab(tabId) {
            // Köhnə aktiv tabları bağla
            document.querySelectorAll('.menu-container').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            // Yeni tabı aktivləşdir
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        // Səhifə açılanda menyunu yüklə
        window.onload = renderMenu;
    </script>
</body>
</html>
