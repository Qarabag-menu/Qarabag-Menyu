<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qarabağ Kafe - Menyu İdarəetmə Sistemi</title>
    <style>
        :root {
            --primary-color: #d4af37; /* Qızılı/Kəhrəba rəng (Kafe və pivə teması üçün) */
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --text-main: #f5f5f5;
            --text-muted: #aaaaaa;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--primary-color);
            font-size: 2.5rem;
            margin-bottom: 5px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .tab-btn {
            background-color: transparent;
            color: var(--text-main);
            border: 2px solid var(--primary-color);
            padding: 10px 25px;
            font-size: 1.1rem;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            background-color: var(--primary-color);
            color: var(--bg-dark);
            font-weight: bold;
        }

        .menu-container {
            width: 100%;
            max-width: 1200px;
            display: none;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }

        .menu-container.active {
            display: grid;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border-top: 4px solid var(--primary-color);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 0;
        }

        .card-price {
            text-align: right;
        }

        .price-main {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
        }

        .price-sub {
            font-size: 0.9rem;
            color: var(--primary-color);
        }

        .table-container {
            width: 100%;
            border-collapse: collapse;
        }

        .table-container th, .table-container td {
            padding: 8px 0;
            text-align: left;
            border-bottom: 1px solid #2a2a2a;
        }
        
        .table-container th {
            color: var(--text-muted);
            font-weight: normal;
            font-size: 0.9rem;
        }

        .table-container td.val {
            text-align: right;
            color: #ddd;
        }

        /* Siqaretlər üçün xüsusi sadə siyahı */
        .cig-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .cig-list li {
            padding: 8px 0;
            border-bottom: 1px dashed #333;
            display: flex;
            justify-content: space-between;
        }
        .cig-list li span.price {
            color: var(--primary-color);
            font-weight: bold;
        }
    </style>
</head>
<body>

        // DOM Elementlərini Doldurmaq
        function renderMenu() {
            const pivaContainer = document.getElementById('piva');
            const siqaretContainer = document.getElementById('siqaret');

            // Pivə Setlərinin render edilməsi
            db.pivaSetleri.forEach(set => {
                let rows = '';
                set.mehsullar.forEach((item, index) => {
                    rows += `
                        <tr>
                            <td>${index + 1}. ${item.ad}</td>
                            <td class="val">${item.p1}</td>
                            <td class="val">${item.p2}</td>
                        </tr>
                    `;
                });

                const cardHTML = `
                    <div class="card">
                        <div class="card-header">
                            <h2 class="card-title">${set.ad}</h2>
                            <div class="card-price">
                                <div class="price-main">${set.qiymet}</div>
                                <div class="price-sub">Set: ${set.setQiymeti}</div>
                            </div>
                        </div>
                        <table class="table-container">
                            <thead>
                                <tr>
                                    <th>Məhsul</th>
                                    <th style="text-align: right">Q-1</th>
                                    <th style="text-align: right">Q-2</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${rows}
                            </tbody>
                        </table>
                    </div>
                `;
                pivaContainer.innerHTML += cardHTML;
            });

            // Siqaretlərin render edilməsi
            db.siqaretler.forEach(marka => {
                let listItems = '';
                marka.novler.forEach(nov => {
                    let qiymetText = nov.qiymet ? `${nov.qiymet} AZN` : '- AZN';
                    listItems += `
                        <li>
                            <span>${nov.ad}</span>
                            <span class="price">${qiymetText}</span>
                        </li>
                    `;
                });

                const cardHTML = `
                    <div class="card">
                        <div class="card-header">
                            <h2 class="card-title">${marka.marka}</h2>
                        </div>
                        <ul class="cig-list">
                            ${listItems}
                        </ul>
                    </div>
                `;
                siqaretContainer.innerHTML += cardHTML;
            });
        }

        // Tablar arası keçid
        function switchTab(tabId) {
            document.querySelectorAll('.menu-container').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        // Səhifə yükləndikdə renderi başlat
        window.onload = renderMenu;
    </script>

</html>
