<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07130f">
<title>Qarabağ Kafe — Menyu</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
    :root {
        --gold: #d6b35a;
        --gold-light: #f0d88b;
        --gold-dark: #9e7b2f;
        --green: #0b241b;
        --green-2: #102f24;
        --green-3: #173c2d;
        --bg: #07110d;
        --card: #0d1b15;
        --card-2: #11251c;
        --text: #f7f2e7;
        --muted: #9fa9a3;
        --line: rgba(214,179,90,.18);
        --shadow: 0 20px 55px rgba(0,0,0,.35);
    }
    * {
        box-sizing: border-box;
    }
    html {
        scroll-behavior: smooth;
    }
    body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Inter', sans-serif;
        color: var(--text);
        background:
            radial-gradient(circle at 15% 5%, rgba(214,179,90,.10), transparent 28%),
            radial-gradient(circle at 90% 15%, rgba(20,90,62,.18), transparent 30%),
            linear-gradient(135deg, #06100c 0%, #091811 50%, #07110d 100%);
        overflow-x: hidden;
    }
    /* ------------------------------
       DECORATIVE BACKGROUND
    ------------------------------ */
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: .025;
        background-image:
            radial-gradient(circle at 20% 20%, #fff 1px, transparent 1px),
            radial-gradient(circle at 80% 70%, #fff 1px, transparent 1px);
        background-size: 90px 90px;
        z-index: -1;
    }
    /* ------------------------------
       HERO
    ------------------------------ */
    .hero {
        position: relative;
        width: 100%;
        min-height: 350px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 55px 20px 45px;
        background:
            linear-gradient(
                180deg,
                rgba(5,18,13,.65),
                rgba(5,18,13,.92)
            ),
            radial-gradient(
                circle at center,
                rgba(214,179,90,.13),
                transparent 55%
            );
        border-bottom: 1px solid rgba(214,179,90,.12);
    }
    .hero::before,
    .hero::after {
        content: "";
        position: absolute;
        width: 180px;
        height: 180px;
        border: 1px solid rgba(214,179,90,.12);
        border-radius: 50%;
    }
    .hero::before {
        left: -80px;
        top: -60px;
    }
    .hero::after {
        right: -80px;
        bottom: -80px;
    }
    .hero-content {
        position: relative;
        z-index: 2;
        max-width: 800px;
    }
    .ornament {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        margin-bottom: 15px;
        color: var(--gold);
        font-size: 15px;
        letter-spacing: 5px;
    }
    .ornament::before,
    .ornament::after {
        content: "";
        width: 75px;
        height: 1px;
        background: linear-gradient(
            90deg,
            transparent,
            var(--gold)
        );
    }
    .ornament::after {
        background: linear-gradient(
            90deg,
            var(--gold),
            transparent
        );
    }
    .hero h1 {
        margin: 0;
        font-family: 'Cormorant Garamond', serif;
        font-size: clamp(3.4rem, 8vw, 6.5rem);
        line-height: .85;
        font-weight: 700;
        letter-spacing: 2px;
        background: linear-gradient(
            135deg,
            #fff4c7,
            var(--gold),
            #b88b32
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 15px 40px rgba(0,0,0,.4);
    }
    .hero-subtitle {
        margin: 20px 0 0;
        color: #d8ddd9;
        font-size: 13px;
        letter-spacing: 4px;
        text-transform: uppercase;
    }
    .hero-description {
        margin: 18px auto 0;
        max-width: 520px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.7;
    }
    .gold-line {
        width: 90px;
        height: 2px;
        margin: 25px auto 0;
        background: linear-gradient(
            90deg,
            transparent,
            var(--gold),
            transparent
        );
    }
    /* ------------------------------
       MENU NAVIGATION
    ------------------------------ */
    .menu-navigation {
        position: sticky;
        top: 0;
        z-index: 100;
        padding: 13px 15px;
        background: rgba(7,17,13,.88);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border-bottom: 1px solid rgba(214,179,90,.13);
    }
    .tabs {
        width: 100%;
        max-width: 1250px;
        margin: auto;
        display: flex;
        gap: 8px;
        overflow-x: auto;
        scrollbar-width: none;
        padding: 2px;
    }
    .tabs::-webkit-scrollbar {
        display: none;
    }
    .tab-btn {
        flex: 0 0 auto;
        border: 1px solid rgba(214,179,90,.23);
        background: rgba(255,255,255,.025);
        color: #c9cfca;
        padding: 11px 17px;
        border-radius: 50px;
        font-family: 'Inter', sans-serif;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition:
            transform .25s ease,
            background .25s ease,
            color .25s ease,
            border-color .25s ease,
            box-shadow .25s ease;
    }
    .tab-btn:hover {
        transform: translateY(-2px);
        color: #fff;
        border-color: rgba(214,179,90,.55);
        background: rgba(214,179,90,.08);
    }
    .tab-btn.active {
        color: #111;
        background: linear-gradient(
            135deg,
            var(--gold-light),
            var(--gold)
        );
        border-color: var(--gold);
        box-shadow:
            0 7px 25px rgba(214,179,90,.18);
    }
    /* ------------------------------
       MAIN
    ------------------------------ */
    .main {
        width: 100%;
        max-width: 1250px;
        margin: 0 auto;
        padding: 42px 20px 70px;
    }
    .section-intro {
        text-align: center;
        margin-bottom: 32px;
    }
    .section-intro h2 {
        margin: 0;
        font-family: 'Cormorant Garamond', serif;
        font-size: 34px;
        color: var(--gold-light);
    }
    .section-intro p {
        margin: 7px 0 0;
        color: var(--muted);
        font-size: 13px;
    }
    /* ------------------------------
       MENU GRID
    ------------------------------ */
    .menu-container {
        width: 100%;
        display: none;
        grid-template-columns:
            repeat(auto-fit, minmax(360px, 1fr));
        gap: 22px;
    }
    .menu-container.active {
        display: grid;
        animation: menuFade .4s ease both;
    }
    @keyframes menuFade {
        from {
            opacity: 0;
            transform: translateY(12px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    /* ------------------------------
       CARDS
    ------------------------------ */
    .card {
        position: relative;
        overflow: hidden;
        background:
            linear-gradient(
                145deg,
                rgba(255,255,255,.035),
                rgba(255,255,255,.012)
            ),
            var(--card);
        border: 1px solid rgba(214,179,90,.12);
        border-radius: 20px;
        padding: 24px;
        box-shadow: var(--shadow);
        transition:
            transform .3s ease,
            border-color .3s ease,
            box-shadow .3s ease;
    }
    .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(
            90deg,
            transparent,
            var(--gold),
            transparent
        );
    }
    .card::after {
        content: "";
        position: absolute;
        width: 130px;
        height: 130px;
        right: -65px;
        top: -65px;
        border-radius: 50%;
        background: rgba(214,179,90,.04);
        pointer-events: none;
    }
    .card:hover {
        transform: translateY(-5px);
        border-color: rgba(214,179,90,.32);
        box-shadow:
            0 25px 60px rgba(0,0,0,.43),
            0 0 0 1px rgba(214,179,90,.04);
    }
    /* ------------------------------
       CARD HEADER
    ------------------------------ */
    .card-header {
        position: relative;
        z-index: 2;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 20px;
        padding-bottom: 17px;
        margin-bottom: 15px;
        border-bottom: 1px solid var(--line);
    }
    .card-title {
        margin: 0;
        font-family: 'Cormorant Garamond', serif;
        font-size: 26px;
        line-height: 1.05;
        color: var(--gold-light);
        font-weight: 700;
    }
    .card-price {
        text-align: right;
        white-space: nowrap;
    }
    .price-main {
        color: #fff;
        font-size: 19px;
        font-weight: 700;
    }
    .price-sub {
        margin-top: 3px;
        color: var(--gold);
        font-size: 12px;
        font-weight: 600;
    }
    /* ------------------------------
       PİVƏ TABLE
    ------------------------------ */
    .table-container {
        width: 100%;
        border-collapse: collapse;
    }
    .table-container th {
        padding: 9px 0;
        color: #7f8c85;
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    .table-container td {
        padding: 11px 0;
        border-bottom: 1px solid rgba(255,255,255,.055);
        color: #dce1dd;
        font-size: 13px;
    }
    .table-container tr:last-child td {
        border-bottom: none;
    }
    .table-container td.val {
        width: 58px;
        text-align: right;
        color: var(--gold-light);
        font-weight: 600;
    }
    /* ------------------------------
       ITEM LIST
    ------------------------------ */
    .item-list {
        list-style: none;
        padding: 0;
        margin: 0;
    }
    .item-list li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        min-height: 43px;
        padding: 8px 0;
        border-bottom: 1px solid rgba(255,255,255,.055);
        color: #dce1dd;
        font-size: 13px;
        transition:
            padding .2s ease,
            color .2s ease;
    }
    .item-list li:last-child {
        border-bottom: none;
    }
    .item-list li:hover {
        padding-left: 5px;
        color: #fff;
    }
    .item-list li span:first-child {
        line-height: 1.45;
    }
    .item-list .price {
        flex: 0 0 auto;
        color: var(--gold-light);
        font-size: 13px;
        font-weight: 700;
        white-space: nowrap;
    }
    /* ------------------------------
       FOOTER
    ------------------------------ */
    footer {
        text-align: center;
        padding: 35px 20px 45px;
        border-top: 1px solid rgba(214,179,90,.10);
        background: rgba(0,0,0,.12);
    }
    .footer-logo {
        font-family: 'Cormorant Garamond', serif;
        color: var(--gold);
        font-size: 27px;
        font-weight: 700;
    }
    .footer-text {
        margin-top: 8px;
        color: #707b75;
        font-size: 11px;
        letter-spacing: 1px;
    }
    /* ------------------------------
       MOBILE
    ------------------------------ */
    @media (max-width: 700px) {
        .hero {
            min-height: 300px;
            padding:
                48px
                18px
                38px;
        }
        .hero h1 {
            font-size: 4rem;
        }
        .hero-subtitle {
            font-size: 10px;
            letter-spacing: 2.5px;
        }
        .hero-description {
            font-size: 12px;
        }
        .ornament::before,
        .ornament::after {
            width: 45px;
        }
        .menu-navigation {
            padding: 10px;
        }
        .tab-btn {
            padding: 10px 14px;
            font-size: 11px;
        }
        .main {
            padding:
                28px
                12px
                55px;
        }
        .section-intro {
            margin-bottom: 22px;
        }
        .section-intro h2 {
            font-size: 29px;
        }
        .menu-container {
            grid-template-columns: 1fr;
            gap: 15px;
        }
        .card {
            padding: 18px;
            border-radius: 17px;
        }
        .card-title {
            font-size: 24px;
        }
        .card-price {
            font-size: 12px;
        }
        .price-main {
            font-size: 17px;
        }
        .table-container td {
            font-size: 12px;
        }
        .item-list li {
            font-size: 12px;
        }
    }
    @media (max-width: 390px) {
        .hero h1 {
            font-size: 3.4rem;
        }
        .hero-subtitle {
            font-size: 9px;
        }
        .card-header {
            gap: 10px;
        }
        .card-title {
            font-size: 21px;
        }
        .main {
            padding-left: 9px;
            padding-right: 9px;
        }
    }
    /* ------------------------------
       SELECTION
    ------------------------------ */
    ::selection {
        background: var(--gold);
        color: #111;
    }
    /* ------------------------------
       SCROLLBAR
    ------------------------------ */
    ::-webkit-scrollbar {
        width: 7px;
        height: 7px;
    }
    ::-webkit-scrollbar-track {
        background: #07110d;
    }
    ::-webkit-scrollbar-thumb {
        background: #304a3c;
        border-radius: 20px;
    }
    ::-webkit-scrollbar-thumb:hover {
        background: var(--gold-dark);
    }
</style>
</head>

    /* ==========================================================
       RENDER MENU
    ========================================================== */
    function renderMenu() {
        const containers = {
            piva: document.getElementById('piva'),
            qelyanalti: document.getElementById('qelyanalti'),
            isti: document.getElementById('isti'),
            murebbe: document.getElementById('murebbe'),
            sirniyyat: document.getElementById('sirniyyat'),
            cerez: document.getElementById('cerez'),
            soyuq: document.getElementById('soyuq'),
            siqaret: document.getElementById('siqaret')
        };
        /* =========================
           PİVƏ SETLƏRİ
        ========================== */
        db.pivaSetleri.forEach(set => {
            let rows = '';
            set.mehsullar.forEach((item, index) => {
                rows += `
                    <tr>
                        <td>
                            ${index + 1}. ${item.ad}
                        </td>
                        <td class="val">
                            ${item.p1 || '—'}
                        </td>
                        <td class="val">
                            ${item.p2 || '—'}
                        </td>
                    </tr>
                `;
            });
            containers.piva.innerHTML += `
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">
                            ${set.ad}
                        </h2>
                        <div class="card-price">
                            <div class="price-main">
                                ${set.qiymet}
                            </div>
                            <div class="price-sub">
                                Set: ${set.setQiymeti}
                            </div>
                        </div>
                    </div>
                    <table class="table-container">
                        <thead>
                            <tr>
                                <th>
                                    Məhsul
                                </th>
                                <th style="text-align:right">
                                    Q-1
                                </th>
                                <th style="text-align:right">
                                    Q-2
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rows}
                        </tbody>
                    </table>
                </div>
            `;
        });
        /* =========================
           LIST CATEGORIES
        ========================== */
        const listCategories = [
            {
                key: 'qelyanaltilar',
                target: 'qelyanalti'
            },
            {
                key: 'istiIckiler',
                target: 'isti'
            },
            {
                key: 'murebbeler',
                target: 'murebbe'
            },
            {
                key: 'sirniyyatlar',
                target: 'sirniyyat'
            },
            {
                key: 'cerezler',
                target: 'cerez'
            },
            {
                key: 'soyuqIckiler',
                target: 'soyuq'
            }
        ];
        listCategories.forEach(catInfo => {
            db[catInfo.key].forEach(kat => {
                let listItems = '';
                kat.mehsullar.forEach(item => {
                    const qText =
                        item.qiymet
                            ? item.qiymet
                            : '—';
                    listItems += `
                        <li>
                            <span>
                                ${item.ad}
                            </span>
                            <span class="price">
                                ${qText}
                            </span>
                        </li>
                    `;
                });
                containers[catInfo.target].innerHTML += `
                    <div class="card">
                        <div class="card-header">
                            <h2 class="card-title">
                                ${kat.kateqoriya}
                            </h2>
                        </div>
                        <ul class="item-list">
                            ${listItems}
                        </ul>
                    </div>
                `;
            });
        });
        /* =========================
           SİQARETLƏR
        ========================== */
        db.siqaretler.forEach(marka => {
            let listItems = '';
            marka.novler.forEach(nov => {
                const qiymetText =
                    nov.qiymet
                        ? `${nov.qiymet} AZN`
                        : '—';
                listItems += `
                    <li>
                        <span>
                            ${nov.ad}
                        </span>
                        <span class="price">
                            ${qiymetText}
                        </span>
                    </li>
                `;
            });
            containers.siqaret.innerHTML += `
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">
                            ${marka.marka}
                        </h2>
                    </div>
                    <ul class="item-list">
                        ${listItems}
                    </ul>
                </div>
            `;
        });
    }
    /* ==========================================================
       TAB SWITCH
    ========================================================== */
    function switchTab(tabId, button) {
        document
            .querySelectorAll('.menu-container')
            .forEach(el => {
                el.classList.remove('active');
            });
        document
            .querySelectorAll('.tab-btn')
            .forEach(el => {
                el.classList.remove('active');
            });
        const selectedMenu =
            document.getElementById(tabId);
        selectedMenu.classList.add('active');
        button.classList.add('active');
        /* Section title */
        const info =
            categoryInfo[tabId];
        document.getElementById('sectionTitle')
            .textContent = info.title;
        document.getElementById('sectionSubtitle')
            .textContent = info.subtitle;
        /* Mobile-də kateqoriyaya keçəndə
           başlığı bir az yuxarı gətir */
        if (window.innerWidth < 700) {
            setTimeout(() => {
                document
                    .querySelector('.section-intro')
                    .scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
            }, 50);
        }
    }
    /* ==========================================================
       START
    ========================================================== */
    window.addEventListener('DOMContentLoaded', () => {
        renderMenu();
    });
