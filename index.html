    <style>
        :root {
            --primary-color: #d4af37;
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --text-main: #f5f5f5;
            --text-muted: #aaaaaa;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--primary-color);
            font-size: 2.5rem;
            margin-bottom: 5px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab-btn {
            background-color: transparent;
            color: var(--text-main);
            border: 2px solid var(--primary-color);
            padding: 8px 16px;
            font-size: 0.9rem;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            background-color: var(--primary-color);
            color: var(--bg-dark);
            font-weight: bold;
        }

        .menu-container {
            width: 100%;
            max-width: 1200px;
            display: none;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }

        .menu-container.active {
            display: grid;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border-top: 4px solid var(--primary-color);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 0;
        }

        .card-price {
            text-align: right;
        }

        .price-main {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
        }

        .price-sub {
            font-size: 0.9rem;
            color: var(--primary-color);
        }

        .table-container {
            width: 100%;
            border-collapse: collapse;
        }

        .table-container th, .table-container td {
            padding: 8px 0;
            text-align: left;
            border-bottom: 1px solid #2a2a2a;
            font-size: 0.95rem;
        }
        
        .table-container th {
            color: var(--text-muted);
            font-weight: normal;
            font-size: 0.9rem;
        }

        .table-container td.val {
            text-align: right;
            color: #ddd;
        }

        .item-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .item-list li {
            padding: 8px 0;
            border-bottom: 1px dashed #333;
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
        }
        .item-list li span.price {
            color: var(--primary-color);
            font-weight: bold;
        }
    </style>
</head>

        function renderMenu() {
            const containers = {
                'piva': document.getElementById('piva'),
                'qelyanalti': document.getElementById('qelyanalti'),
                'isti': document.getElementById('isti'),
                'murebbe': document.getElementById('murebbe'),
                'sirniyyat': document.getElementById('sirniyyat'),
                'cerez': document.getElementById('cerez'),
                'soyuq': document.getElementById('soyuq'),
                'siqaret': document.getElementById('siqaret')
            };

            // Pivə Setləri
            db.pivaSetleri.forEach(set => {
                let rows = '';
                set.mehsullar.forEach((item, index) => {
                    rows += `
                        <tr>
                            <td>${index + 1}. ${item.ad}</td>
                            <td class="val">${item.p1}</td>
                            <td class="val">${item.p2}</td>
                        </tr>
                    `;
                });

                containers['piva'].innerHTML += `
                    <div class="card">
                        <div class="card-header">
                            <h2 class="card-title">${set.ad}</h2>
                            <div class="card-price">
                                <div class="price-main">${set.qiymet}</div>
                                <div class="price-sub">Set: ${set.setQiymeti}</div>
                            </div>
                        </div>
                        <table class="table-container">
                            <thead>
                                <tr>
                                    <th>Məhsul</th>
                                    <th style="text-align: right">Q-1</th>
                                    <th style="text-align: right">Q-2</th>
                                </tr>
                            </thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>
                `;
            });

            // Qəlyanaltılar, İsti, Mürəbbə, Şirniyyat, Çərəz, Soyuq (Siyahı tiplilər)
            const listCategories = [
                { key: 'qelyanaltilar', target: 'qelyanalti' },
                { key: 'istiIckiler', target: 'isti' },
                { key: 'murebbeler', target: 'murebbe' },
                { key: 'sirniyyatlar', target: 'sirniyyat' },
                { key: 'cerezler', target: 'cerez' },
                { key: 'soyuqIckiler', target: 'soyuq' }
            ];

            listCategories.forEach(catInfo => {
                db[catInfo.key].forEach(kat => {
                    let listItems = '';
                    kat.mehsullar.forEach(item => {
                        let qText = item.qiymet ? `${item.qiymet}` : '- AZN';
                        listItems += `
                            <li>
                                <span>${item.ad}</span>
                                <span class="price">${qText}</span>
                            </li>
                        `;
                    });

                    containers[catInfo.target].innerHTML += `
                        <div class="card">
                            <div class="card-header">
                                <h2 class="card-title">${kat.kateqoriya}</h2>
                            </div>
                            <ul class="item-list">${listItems}</ul>
                        </div>
                    `;
                });
            });

            // Siqaretlər
            db.siqaretler.forEach(marka => {
                let listItems = '';
                marka.novler.forEach(nov => {
                    let qiymetText = nov.qiymet ? `${nov.qiymet} AZN` : '- AZN';
                    listItems += `
                        <li>
                            <span>${nov.ad}</span>
                            <span class="price">${qiymetText}</span>
                        </li>
                    `;
                });

                containers['siqaret'].innerHTML += `
                    <div class="card">
                        <div class="card-header">
                            <h2 class="card-title">${marka.marka}</h2>
                        </div>
                        <ul class="item-list">${listItems}</ul>
                    </div>
                `;
            });
        }

        function switchTab(tabId) {
            document.querySelectorAll('.menu-container').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        window.onload = renderMenu;
    </script>
</body>
</html>
