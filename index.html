<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qarabağ Çay Evi - Menyu</title>
    <style>
        :root {
            --bg: #fbfaf7;
            --card: #ffffff;
            --text: #2b2622;
            --muted: #8a8279;
            --line: #ece7df;
            --accent: #8c3b2a;      /* mürəbbə / çay rəngi */
            --accent-soft: #f3e6e1;
        }
 
        * { box-sizing: border-box; }
 
        body {
            margin: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-text-size-adjust: 100%;
        }
 
        header {
            text-align: center;
            padding: 36px 16px 20px;
        }
 
        h1 {
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin: 0 0 6px;
        }
 
        .subtitle {
            font-size: 0.85rem;
            letter-spacing: 4px;
            color: var(--muted);
            text-transform: uppercase;
        }
 
        /* Yapışan və yana sürüşən kateqoriya paneli */
        .tabs-wrap {
            position: sticky;
            top: 0;
            z-index: 10;
            background: var(--bg);
            border-bottom: 1px solid var(--line);
        }
 
        .tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 12px 16px;
            max-width: 760px;
            margin: 0 auto;
            scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar { display: none; }
 
        .tab-btn {
            flex: 0 0 auto;
            background: transparent;
            color: #5b534b;
            border: 1px solid var(--line);
            padding: 8px 16px;
            font-size: 0.9rem;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            transition: background .15s, color .15s, border-color .15s;
        }
        .tab-btn:hover { border-color: var(--accent); color: var(--accent); }
        .tab-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .tab-btn:focus-visible, .search input:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
 
        main {
            max-width: 760px;
            margin: 0 auto;
            padding: 20px 16px 60px;
        }
 
        .search { margin-bottom: 18px; }
        .search input {
            width: 100%;
            padding: 11px 14px;
            font-size: 0.95rem;
            font-family: inherit;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--card);
            color: var(--text);
        }
 
        .menu-container { display: none; }
        .menu-container.active { display: block; }
 
        .category-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin: 26px 0 4px;
            color: var(--text);
        }
        .category-title:first-child { margin-top: 4px; }
 
        .item-list { list-style: none; padding: 0; margin: 0; }
 
        .item-list li {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 0;
            border-bottom: 1px solid var(--line);
        }
        .item-list li:last-child { border-bottom: none; }
 
        .thumb {
            flex: 0 0 64px;
            width: 64px;
            height: 64px;
            border-radius: 10px;
            background: var(--accent-soft);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.7rem;
        }
        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
 
        .item-name { flex: 1; font-size: 0.98rem; line-height: 1.3; }
        .item-price { font-weight: 600; white-space: nowrap; }
 
        .empty-message {
            text-align: center;
            color: var(--muted);
            margin-top: 40px;
            font-size: 0.95rem;
        }
 
        footer {
            text-align: center;
            color: var(--muted);
            font-size: 0.8rem;
            padding: 0 16px 40px;
        }
 
        @media (max-width: 420px) {
            h1 { font-size: 1.6rem; letter-spacing: 4px; }
            .thumb { flex-basis: 56px; width: 56px; height: 56px; }
        }
    </style>
</head>
<body>
 
    <header>
        <h1>Qarabağ</h1>
        <div class="subtitle">Çay Evi</div>
    </header>
 
    <div class="tabs-wrap">
        <div class="tabs" id="tabs"></div>
    </div>
 
    <main>
        <div class="search">
            <input type="search" id="search" placeholder="Menyuda axtar..." autocomplete="off" aria-label="Menyuda axtar">
        </div>
        <div id="menus"></div>
        <div class="empty-message" id="noResult" style="display:none;">Heç nə tapılmadı.</div>
    </main>
 
    <footer>Qiymətlər AZN ilə göstərilib.</footer>
 
    <script>
        /* ------------------------------------------------------------------
           ŞƏKİLLƏR HAQQINDA:
           Hər məhsulun şəkli "sekiller" qovluğunda "kod.jpg" adı ilə axtarılır.
           Məsələn: sekiller/heyva.jpg
           Şəkil yoxdursa, avtomatik emoji görünür (sayt pozulmur).
           Şəkil formatı fərqlidirsə (webp, png), aşağıdakı IMG_EXT dəyişin.
           İstəsəniz məhsula tam link də verə bilərsiniz: { ..., sekil: "https://..." }
        ------------------------------------------------------------------ */
        const IMG_DIR = 'sekiller/';
        const IMG_EXT = '.jpg';
 
        // m(kod, ad, qiymət, emoji, ŞƏKİL LİNKİ)
        // Axırıncı dırnaq "" şəkil linki yeridir: oraya link yapışdır, məsələn "https://.../heyva.jpg"
        // Boş buraxsan sayt sekiller/kod.jpg faylını axtarır, o da yoxdursa emoji göstərir.
        const m = (kod, ad, qiymet, emoji, sekil) => ({ kod, ad, qiymet, emoji, sekil });
 
        const db = {
            murebbe: [
                { kateqoriya: "Mürəbbələr", mehsullar: [
                    m("heyva", "HEYVA mürəbbəsi", "5.00", "🍐", "https://www.azcookbook.com/wp-content/uploads/2010/11/quince-preserve2.jpg"),
                    m("encir", "Əncir mürəbbəsi", "5.00", "🍯", "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSC20Yj2bV4zakWyttxsvGERGYn9T6RUW3yzplvx4DCUksuEDY9zRC1p5g8&s=10"),
                    m("boyurtken", "BÖYÜRTKƏN mürəbbəsi", "5.00", "🫐", ""),
                    m("ciyelek", "ÇİYƏLƏK mürəbbəsi", "5.00", "🍓", "https://upload.wikimedia.org/wikipedia/commons/8/88/Az-Strawberry_jam%2C_making_by_e-citizen_%28moonsun1981%29.JPG?utm_source=az.wikibooks.org&utm_campaign=index&utm_content=original"),
                    m("armud", "ARMUD mürəbbəsi", "5.00", "🍐", ""),
                    m("nar", "NAR mürəbbəsi", "5.00", "🍎", ""),
                    m("kivi", "KİVİ mürəbbəsi", "5.00", "🥝", ""),
                    m("cir-visne", "Cır VİŞNƏ mürəbbəsi", "5.00", "🍒", ""),
                    m("ag-erik", "Ağ ƏRİK mürəbbəsi", "6.00", "🍑", ""),
                    m("ag-gilas", "Ağ GİLAS mürəbbəsi", "6.00", "🍒", ""),
                    m("zogal", "ZOĞAL mürəbbəsi", "6.00", "🍒", ""),
                    m("qizilgul", "QIZILGÜL mürəbbəsi", "6.00", "🌹", ""),
                    m("qarpiz", "Qarpız mürəbbəsi", "6.00", "🍉", ""),
                    m("sponka-visne", "ŞPONKA VİŞNƏ mürəbbəsi", "6.50", "🍒", ""),
                    m("yasil-badam", "Yaşıl BADAM mürəbbəsi", "6.50", "🌰", ""),
                    m("qirmizi-badam", "Qırmızı BADAM mürəbbəsi", "6.50", "🌰", ""),
                    m("sari-badam", "Sarı BADAM mürəbbəsi", "6.50", "🌰", ""),
                    m("snikers", "Snikers mürəbbəsi", "6.50", "🍫", ""),
                    m("baunty", "Baunty mürəbbəsi", "6.50", "🥥", ""),
                    m("ananas", "Ananas mürəbbəsi", "6.50", "🍍", ""),
                    m("qirmizi-gilas", "Qırmızı GİLAS mürəbbəsi", "7.00", "🍒", ""),
                    m("malina", "MALİNA mürəbbəsi", "7.00", "🍓", ""),
                    m("zeytun", "ZEYTUN mürəbbəsi", "7.00", "🫒", ""),
                    m("dondurma", "DONDURMA mürəbbəsi", "7.00", "🍦", ""),
                    m("bananli-plombir", "BANANLI PLOMBİR mürəbbəsi", "8.00", "🍌", ""),
                    m("qoz", "QOZ mürəbbəsi", "8.00", "🌰", "")
                ]}
            ],
            isti: [],
            soyuq: [],
            sirniyyat: [],
            cerez: [],
            qelyanalti: [],
            piva: [],
            siqaret: []
        };
 
        const categories = [
            { id: 'murebbe',   ad: 'Mürəbbələr' },
            { id: 'isti',      ad: 'İsti İçkilər' },
            { id: 'soyuq',     ad: 'Soyuq İçkilər' },
            { id: 'sirniyyat', ad: 'Şirniyyat' },
            { id: 'cerez',     ad: 'Çərəzlər' },
            { id: 'qelyanalti',ad: 'Qəlyanaltılar' },
            { id: 'piva',      ad: 'Pivə Setləri' },
            { id: 'siqaret',   ad: 'Siqaretlər' }
        ];
 
        function esc(s) {
            return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }
 
        function thumbHTML(item) {
            const emoji = item.emoji || '🍵';
            const src = item.sekil || (item.kod ? IMG_DIR + item.kod + IMG_EXT : '');
            if (!src) return `<div class="thumb" aria-hidden="true">${emoji}</div>`;
            // Şəkil yüklənməsə emoji göstərilir
            return `<div class="thumb" aria-hidden="true">
                <img src="${esc(src)}" alt="" loading="lazy"
                     onerror="this.parentNode.textContent='${emoji}'">
            </div>`;
        }
 
        function renderMenu() {
            const tabs = document.getElementById('tabs');
            const menus = document.getElementById('menus');
            let tabsHtml = '', menusHtml = '';
 
            categories.forEach((cat, i) => {
                tabsHtml += `<button class="tab-btn${i === 0 ? ' active' : ''}" data-tab="${cat.id}">${cat.ad}</button>`;
 
                const data = db[cat.id];
                let inner = '';
                if (data.length === 0) {
                    inner = `<div class="empty-message">Bu bölməyə tezliklə məhsullar əlavə olunacaq.</div>`;
                } else {
                    data.forEach(qrup => {
                        const items = qrup.mehsullar.map(item => `
                            <li>
                                ${thumbHTML(item)}
                                <span class="item-name">${esc(item.ad)}</span>
                                <span class="item-price">${item.qiymet ? esc(item.qiymet) + ' ₼' : ''}</span>
                            </li>`).join('');
                        inner += `<h2 class="category-title">${esc(qrup.kateqoriya)}</h2>
                                  <ul class="item-list">${items}</ul>`;
                    });
                }
                menusHtml += `<div id="${cat.id}" class="menu-container${i === 0 ? ' active' : ''}">${inner}</div>`;
            });
 
            tabs.innerHTML = tabsHtml;
            menus.innerHTML = menusHtml;
 
            tabs.addEventListener('click', e => {
                const btn = e.target.closest('.tab-btn');
                if (btn) switchTab(btn);
            });
        }
 
        function switchTab(btn) {
            document.querySelectorAll('.menu-container').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(btn.dataset.tab).classList.add('active');
            btn.classList.add('active');
            btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            document.getElementById('search').value = '';
            filterItems('');
        }
 
        // Aktiv bölmədə axtarış
        function filterItems(q) {
            q = q.trim().toLocaleLowerCase('az');
            const active = document.querySelector('.menu-container.active');
            let shown = 0;
            active.querySelectorAll('.item-list li').forEach(li => {
                const name = li.querySelector('.item-name').textContent.toLocaleLowerCase('az');
                const match = !q || name.includes(q);
                li.style.display = match ? '' : 'none';
                if (match) shown++;
            });
            const hasItems = active.querySelector('.item-list');
            document.getElementById('noResult').style.display = (hasItems && shown === 0) ? 'block' : 'none';
        }
 
        document.addEventListener('DOMContentLoaded', () => {
            renderMenu();
            document.getElementById('search').addEventListener('input', e => filterItems(e.target.value));
        });
    </script>
</body>
</html>
